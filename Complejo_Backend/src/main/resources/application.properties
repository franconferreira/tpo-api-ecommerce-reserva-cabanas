# Los datos sensibles (DB_PASSWORD, JWT_SECRET) se leen del archivo .env de esta carpeta,
# que NO se sube a git. Ver .env.example para saber que variables completar.
spring.config.import=optional:file:.env[.properties]

spring.application.name=ComplejoTuristico
spring.datasource.url=jdbc:mysql://localhost:3306/complejo_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT Secret
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
